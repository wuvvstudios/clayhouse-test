<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Make your player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Oswald:wght@400;500;600;700&display=swap">
<style>
:root{ --ink:#1B1B1B; --cream:#F3E6C8; --gold:#F6C343; --red:#D8402B; --blue:#2B5A97 }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ margin:0; height:100%; background:var(--blue); color:var(--cream); font-family:'Oswald','Arial Narrow',sans-serif; overscroll-behavior:none }
body{ display:flex; flex-direction:column; height:100dvh; background:repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,240,200,0.06) 0deg 7deg,rgba(0,0,0,0) 7deg 14deg),var(--blue) }
button{ font:inherit; color:inherit; cursor:pointer }
.glass{ background:var(--cream); border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); color:var(--ink) }
.glass:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink) }
.red{ background:var(--red); color:var(--cream); border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink) }
header{ display:flex; align-items:center; justify-content:space-between; padding:max(12px,env(safe-area-inset-top)) 16px 4px }
header h1{ margin:0; font-family:'Bungee',sans-serif; font-weight:400; font-size:26px; color:var(--gold); -webkit-text-stroke:1.2px var(--ink); text-shadow:2px 2px 0 #B5541E,4px 4px 0 var(--ink) }
#link{ font-size:13px; padding:5px 10px; border-radius:999px; background:rgba(20,22,48,.5); border:2px solid var(--ink) }
#prev{ position:relative; flex:0 0 42dvh; touch-action:none }
#prev canvas{ position:absolute; inset:0; width:100%; height:100% }
#load{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Bungee',sans-serif; font-size:18px; text-align:center; padding:20px }
.turn{ position:absolute; bottom:8px; display:flex; gap:10px; left:50%; transform:translateX(-50%) }
.turn button{ height:40px; padding:0 14px; border-radius:999px; font-family:'Bungee',sans-serif; font-size:14px }
#tabs{ display:flex; gap:8px; overflow-x:auto; padding:8px 16px 10px; scrollbar-width:none }
#tabs::-webkit-scrollbar{ display:none }
.tab{ flex:none; height:44px; padding:0 16px; border-radius:999px; font-family:'Bungee',sans-serif; font-size:14px }
.tab.on{ background:var(--red); color:var(--cream) }
#panel{ flex:1; overflow:auto; padding:4px 16px 16px }
.h{ font-family:'Bungee',sans-serif; font-size:15px; color:var(--gold); text-shadow:1px 1px 0 var(--ink); margin:10px 0 8px }
.grid{ display:flex; flex-wrap:wrap; gap:10px }
.opt{ min-width:88px; height:56px; padding:0 14px; border-radius:16px; font-family:'Bungee',sans-serif; font-size:13px }
.opt.on{ outline:4px solid var(--gold); outline-offset:2px }
.sw{ width:56px; min-width:0; padding:0; border-radius:50% }
.sl{ display:grid; grid-template-columns:110px 52px 1fr 52px; gap:8px; align-items:center; margin-bottom:8px; font-size:15px; font-weight:600 }
.sl button{ height:48px; border-radius:14px; font-family:'Bungee',sans-serif; font-size:22px }
.bar{ height:10px; border-radius:999px; background:rgba(243,230,200,.25); position:relative; border:2px solid var(--ink) }
.bar i{ position:absolute; top:-7px; width:20px; height:20px; border-radius:50%; background:var(--gold); border:2px solid var(--ink); transform:translateX(-50%) }
.lock{ border:2px dashed rgba(243,230,200,.6); border-radius:16px; padding:12px 14px; font-size:15px; line-height:1.35 }
.lock b{ font-family:'Bungee',sans-serif; font-weight:400; color:var(--gold) }
footer{ display:flex; gap:10px; padding:10px 16px max(14px,env(safe-area-inset-bottom)); background:rgba(20,22,48,.35); border-top:3px solid var(--ink) }
footer button{ height:58px; border-radius:18px; font-family:'Bungee',sans-serif; font-size:17px }
#rand{ flex:0 0 auto; padding:0 16px }
#send{ flex:1 }
#toast{ position:fixed; left:16px; right:16px; top:40%; text-align:center; font-family:'Bungee',sans-serif; font-size:20px; padding:18px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .25s }
#toast.on{ opacity:1 }
</style></head>
<body>
<header><h1>Make your player</h1><span id="link">Not linked</span></header>
<div id="prev"><canvas></canvas><div id="load">Getting your figure ready…</div>
  <div class="turn"><button class="glass" data-turn="-1">◀ Turn</button><button class="glass" data-turn="1">Turn ▶</button></div></div>
<nav id="tabs"></nav>
<main id="panel"></main>
<footer><button class="glass" id="rand">Surprise me</button><button class="red" id="send">Save</button></footer>
<div id="toast" class="glass"></div>
<script src="lib/three.min.js"></script>
<script src="lib/clayfigure_data.js"></script>
<script src="lib/clayfigure.js"></script>
<script src="lib/clayavatar.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="lib/mqtt.min.js?v=5"></script>
<script src="link.js?v=5"></script>
<script>
// Make your player on your phone, then send it to the TV. Opened from the TV's QR (create.html#CODE) or on its own.
// The look is kept on this phone (clayhouse.myfigure), so next time it is ready to send to any TV.
(function(){
const $ = s => document.querySelector(s), MINE = 'clayhouse.myfigure', KEY = 'clayhouse.figure';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const code = (window.ClayLink ? ClayLink.cleanCode(location.hash.slice(1)) : '') || '';
const TABS = [['body', 'Body'], ['skin', 'Skin'], ['face', 'Face'], ['eyes', 'Eyes'], ['brows', 'Brows & lips'], ['hair', 'Hair'], ['facial', 'Facial hair'], ['extras', 'Extras'], ['outfit', 'Outfit']];
const HEAD = { face: 1, eyes: 1, brows: 1, hair: 1, facial: 1, extras: 1 };
const PANTS = ['#2f4266', '#2b2b30', '#7e9bc6', '#c9b49a', '#4a5d3a', '#6b5a48', '#efe6d2', '#7a1f2b'];
const SHOES = ['#e0583a', '#c75b7a', '#2fb39a', '#f2c230', '#3a6ea8', '#7a3fb5', '#1b1b1b', '#f3f0e8'];
const rgb = a => `rgb(${a.map(v => v <= 1 ? Math.round(Math.pow(v, 1 / 2.2) * 255) : v).join(',')})`;
let tab = 'body', look = null, av = null, yaw = 0, zoom = 0, r, sc, cam, last = 0;
let link = null, outbox = null, sendId = 0, acked = 0;

function toast(t, ms){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms || 1800); }
const D = () => ClayFigure.data;
const opt = (k, v, label, on, style) => `<button class="glass opt${style ? ' sw' : ''}${on ? ' on' : ''}" data-k="${k}" data-v="${v}"${style ? ` style="${style}" aria-label="${esc(label)}"` : ''}>${style ? '' : esc(label)}</button>`;
const slider = (key, label) => { const v = look.shape[key] || 0; return `<div class="sl"><span>${esc(label)}</span><button class="glass" data-k="s:${key}" data-v="-1" aria-label="Less ${esc(label)}">−</button><div class="bar"><i style="left:${(v + 1) * 50}%"></i></div><button class="glass" data-k="s:${key}" data-v="1" aria-label="More ${esc(label)}">+</button></div>`; };
function panel(){
  $('#tabs').querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const d = D(), L = look; let h = '';
  if (tab === 'body') h = `<div class="h">Body type</div><div class="grid">${opt('base', 'male', 'Body type 1', L.base === 'male')}${opt('base', 'female', 'Body type 2', L.base === 'female')}</div>`;
  if (tab === 'skin') h = `<div class="h">Skin tone</div><div class="grid">${d.tones.map((t, i) => opt('tone', i, t.name, L.tone === i, `background:${rgb(t.rgb)}`)).join('')}</div>`;
  if (tab === 'face') h = `<div class="h">Start from</div><div class="grid">${d.presets.map((p, i) => opt('preset', i, p.label, false)).join('')}</div><div class="h">Shape</div>${d.shapes.filter(s => s.key !== 'old').map(s => slider(s.key, s.label)).join('')}`;
  if (tab === 'eyes') h = `<div class="h">Eye color</div><div class="grid">${d.eyeColors.map((c, i) => opt('eye', i, c.name, L.eye === i, `background:${rgb(c.rgb)}`)).join('')}</div>
    <div class="h">Lashes</div><div class="grid">${opt('liner', 0, 'None', L.liner === 0)}${opt('liner', 1, 'Soft', L.liner === 1)}${opt('liner', 2, 'Bold', L.liner === 2)}</div>
    <div class="h">Eyes</div>${slider('eye', 'Size')}${slider('esp', 'Spacing')}${slider('eyeTilt', 'Tilt')}`;
  if (tab === 'brows') h = `<div class="h">Brows</div><div class="grid">${[0, 1, 2, 3, 4].map(i => opt('brow', i, 'Style ' + (i + 1), L.brow === i)).join('')}</div>
    <div class="h">Brow color</div><div class="grid">${opt('browC', -1, 'Match hair', L.browC === -1)}${d.hairColors.map((c, i) => opt('browC', i, c.name, L.browC === i, `background:${rgb(c.rgb)}`)).join('')}</div>
    <div class="h">Lip color</div><div class="grid">${opt('lip', -1, 'Natural', L.lip === -1)}${d.lipTints.map((c, i) => opt('lip', i, c.name, L.lip === i, `background:${rgb(c.rgb)}`)).join('')}</div>
    <div class="h">Lips</div>${slider('lips', 'Fullness')}${slider('lipW', 'Width')}`;
  if (tab === 'hair') h = `<div class="h">Style</div><div class="grid">${d.hairs.map(x => opt('hair', x.key, x.label, L.hair === x.key)).join('')}</div>
    <div class="h">Color</div><div class="grid">${d.hairColors.map((c, i) => opt('hairC', i, c.name, L.hairC === i, `background:${rgb(c.rgb)}`)).join('')}</div>`;
  if (tab === 'facial') h = `<div class="h">Facial hair</div><div class="grid">${[['none', 'None'], ['stubble', 'Stubble'], ['mustache', 'Mustache'], ['goatee', 'Goatee'], ['beard', 'Beard']].map(([k, l]) => opt('facial', k, l, L.facial === k)).join('')}</div>`;
  if (tab === 'extras') h = `<div class="h">Glasses</div><div class="grid">${[['none', 'None'], ['round', 'Round'], ['rect', 'Square'], ['cat', 'Cat eye']].map(([k, l]) => opt('glasses', k, l, L.glasses === k)).join('')}</div>
    <div class="h">Earrings</div><div class="grid">${[['none', 'None'], ['studs', 'Studs'], ['hoops', 'Hoops']].map(([k, l]) => opt('ears', k, l, L.ears === k)).join('')}</div>`;
  if (tab === 'outfit') h = `<div class="h">Shirt</div><div class="lock"><b>Wuvv shirts</b><br>Shirts will be Wuvv pieces only. They land here once the shirt artwork is in.</div>
    <div class="h">Pants</div><div class="grid">${PANTS.map(c => opt('pants', c, c, L.pants === c, `background:${c}`)).join('')}</div>
    <div class="h">Shoe accents</div><div class="grid">${SHOES.map(c => opt('accent', c, c, L.accent === c, `background:${c}`)).join('')}</div>`;
  $('#panel').innerHTML = h;
}
function remake(){
  if (av){ try { av.dispose(); } catch (_) {} av = null; }
  let prev = null; try { prev = localStorage.getItem(KEY); localStorage.setItem(KEY, JSON.stringify(look)); } catch (_) {}
  try { av = ClayAvatar.make(ClayAvatar.specs({ players: 1 }, 1)[0], { height: 1.8, shirt: look.tee }); av.root.rotation.y = yaw; sc.add(av.root); } catch (e) { console.warn(e); }
  try { if (prev == null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, prev); } catch (_) {}
  try { localStorage.setItem(MINE, JSON.stringify(look)); } catch (_) {}
}
function surprise(){
  const d = D(), pick = a => a[(Math.random() * a.length) | 0];
  Object.assign(look, { base: Math.random() < 0.5 ? 'male' : 'female', tone: (Math.random() * d.tones.length) | 0, eye: (Math.random() * d.eyeColors.length) | 0,
    hair: pick(d.hairs).key, hairC: (Math.random() * 6) | 0, brow: (Math.random() * 5) | 0, browC: -1, glasses: pick(['none', 'none', 'none', 'round', 'rect', 'cat']),
    ears: pick(['none', 'none', 'studs', 'hoops']), shape: Object.assign({}, pick(d.presets).v || {}), pants: pick(PANTS), accent: pick(SHOES) });
  look.facial = look.base === 'male' ? pick(['none', 'none', 'stubble', 'goatee', 'beard', 'mustache']) : 'none';
  look.liner = look.base === 'female' ? 1 + ((Math.random() * 2) | 0) : (Math.random() < 0.5 ? 0 : 1);
  panel(); remake();
}
function loop(now){
  requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000 || 0), t = now / 1000; last = now;
  const cv = $('#prev canvas'), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * 2 || cv.height !== h * 2){ r.setSize(w * 2, h * 2, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  if (!av) return;
  av.root.rotation.y += (yaw - av.root.rotation.y) * (1 - Math.exp(-dt * 8));
  if (av.update) av.update(dt, t);
  if (av.play && av.hasAnim && av.hasAnim('Idle_Loop')){ av.play('Idle_Loop', {}); av.animate(dt); }
  zoom += ((HEAD[tab] ? 1 : 0) - zoom) * (1 - Math.exp(-dt * 5));
  const y = 0.95 + 0.62 * zoom, dist = 5.2 - 3.7 * zoom; cam.position.set(0, y + 0.02, dist); cam.lookAt(0, y, 0);
  r.render(sc, cam);
}
// ---------- the TV link ----------
function connect(){
  if (!code || !window.ClayLink){ $('#link').textContent = 'Not linked'; return; }
  $('#send').textContent = 'Send to TV';
  link = ClayLink.join(code, m => { if (m && m.t === 'fig-ok' && +m.id >= sendId && sendId){ if (acked !== sendId){ acked = sendId; outbox = null; toast('Sent! Look at the TV.', 2400); } } },
    s => { $('#link').textContent = s === 'direct' || s === 'relay' ? 'TV ' + code : s === 'nohost' ? 'No TV found' : 'Linking…'; });
  setInterval(() => { if (outbox && link) link.send(outbox); }, 700);
}
function send(){
  try { localStorage.setItem(MINE, JSON.stringify(look)); } catch (_) {}
  if (!code){ toast('Saved on this phone. Scan the TV code to send it.', 2600); return; }
  sendId = Date.now(); outbox = { t: 'fig-set', id: sendId, look }; if (link) link.send(outbox); toast('Sending…', 1200);
}
function start(){
  if (!window.THREE || !window.ClayFigure || !window.ClayAvatar){ $('#load').textContent = 'Could not load the figure. Check your connection and refresh.'; return; }
  let mine = null; try { mine = JSON.parse(localStorage.getItem(MINE) || 'null'); } catch (_) {}
  look = Object.assign({}, ClayFigure.DEF, ClayFigure.SLOTS[0] || {}, mine || {}); look.shape = Object.assign({}, look.shape || {});
  r = new THREE.WebGLRenderer({ canvas: $('#prev canvas'), alpha: true, antialias: true }); r.setPixelRatio(1);
  sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1)); const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(1, 2, 3); sc.add(dl);
  cam = new THREE.PerspectiveCamera(24, 1, 0.05, 50);
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="glass tab" data-tab="${k}">${l}</button>`).join('');
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tab){ tab = b.dataset.tab; panel(); return; }
    if (b.dataset.turn){ yaw += +b.dataset.turn * 0.6; return; }
    if (b.id === 'rand') return surprise();
    if (b.id === 'send') return send();
    if (b.dataset.k){ const k = b.dataset.k; let v = b.dataset.v; v = /^-?\d+$/.test(v) ? +v : v;
      if (k === 'preset') look.shape = Object.assign({}, (D().presets[v] || {}).v || {});
      else if (k.startsWith('s:')){ const s = k.slice(2); look.shape = Object.assign({}, look.shape); look.shape[s] = Math.max(-1, Math.min(1, Math.round(((look.shape[s] || 0) + v * 0.25) * 100) / 100)); }
      else look[k] = v;
      panel(); remake(); }
  });
  const cv = $('#prev canvas'); let dx = null;
  cv.addEventListener('pointerdown', e => { dx = e.clientX; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (dx != null){ yaw += (e.clientX - dx) * 0.012; dx = e.clientX; } });
  cv.addEventListener('pointerup', () => { dx = null; });
  panel();
  (ClayFigure.ready || Promise.resolve()).then(() => { remake(); $('#load').remove(); requestAnimationFrame(loop); });
  connect();
}
start();
})();
</script>
</body></html>
